[package]
name = "bsv-messagebox-client"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
description = "BSV MessageBox client — peer-to-peer messaging and payments with BRC-78 encryption, WebSocket live delivery, and overlay host resolution. Full parity with @bsv/message-box-client."
license-file = "LICENSE"
repository = "https://github.com/b1narydt/rust-messagebox-client"
keywords = ["bsv", "blockchain", "messaging", "p2p", "bitcoin"]
categories = ["cryptography", "network-programming"]

[lib]
name = "bsv_messagebox_client"

[dependencies]
# Shared BRC-103 Socket.IO transport (extracted from this crate's websocket.rs
# + socket_transport.rs).
authsocket = { version = "0.4.0", features = ["client"] }
# authsocket must declare the SAME bsv-sdk major as this crate does, or the graph
# splits into two `bsv` packages and every `W: WalletInterface` bound stops
# matching. authsocket 0.1.3 declares ^0.4.0, so 0.2.0 (bsv-sdk 0.5) is required
# here — a `0.1.x` req would happily resolve back to 0.1.3 and split the graph.
bsv-sdk = { version = "0.7.0", features = ["network"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"
thiserror = "2"
rust_socketio = { version = "0.6", features = ["async"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
